[project]
name = "medicine-analog"
version = "0.1.0"
description = "Django web app for searching medicines, comparing pharmacy prices and finding analogs by active ingredient"
readme = "README.md"
requires-python = ">=3.12.0, <3.13"
dependencies = [
    "django~=5.1.6",
    "requests>=2.32.4,<3",
    "scrapy>=2.12.0,<3",
    "beautifulsoup4>=4.13.3,<5",
    "lxml>=5.3.1,<6",
    "itemadapter>=0.11.0,<1",
    "openai>=2.6.1,<3",
    "google-genai>=1.46.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
]

[tool.uv.sources]

[tool.django]
settings-module = "MedicineAnalog.settings"
